name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild -project ClassicPlayer.xcodeproj \
            -scheme ClassicPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ClassicPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ClassicPlayer.xcarchive/Products/Applications/*.app Payload/
          zip -r ClassicPlayer.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicPlayer-IPA
          path: ClassicPlayer.ipa
